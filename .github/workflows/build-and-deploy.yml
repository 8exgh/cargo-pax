# Builds both images, pushes them to ghcr.io, then asks the devops repo to
# deploy. Everything is derived from the repository name, so a repo spun off
# from this template needs no edits here — it needs:
#   1. A DEPLOY_TOKEN repo secret (PAT with repo scope on <owner>/devops)
#   2. A deploy workflow in <owner>/devops listening for
#      repository_dispatch type "<repo-name>-deploy"
#      (copy devops/.github/workflows/deploy-starter-site.yml)
name: Build and Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # ghcr image names must be lowercase; keep repo names lowercase
  BACKEND_IMAGE: ${{ github.repository_owner }}/${{ github.event.repository.name }}-backend
  PROCESSOR_IMAGE: ${{ github.repository_owner }}/${{ github.event.repository.name }}-processor

jobs:
  build-backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Record build time
        id: buildinfo
        run: echo "time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (Backend)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./nextjs-app
          file: ./nextjs-app/Dockerfile
          push: true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.buildinfo.outputs.time }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-processor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run processor unit tests
        run: |
          cd background-processor
          npm ci
          npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Record build time
        id: buildinfo
        run: echo "time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (Processor)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.PROCESSOR_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Processor Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./background-processor
          file: ./background-processor/Dockerfile
          push: true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.buildinfo.outputs.time }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=processor
          cache-to: type=gha,mode=max,scope=processor

  deploy:
    runs-on: ubuntu-latest
    needs: [build-backend, build-processor]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Trigger deployment
        run: |
          curl -f -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository_owner }}/devops/dispatches \
            -d '{
              "event_type": "${{ github.event.repository.name }}-deploy",
              "client_payload": {
                "app": "${{ github.event.repository.name }}",
                "backend_image": "${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:latest",
                "processor_image": "${{ env.REGISTRY }}/${{ env.PROCESSOR_IMAGE }}:latest"
              }
            }'
